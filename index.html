<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="%BASE_URL%favicon.png" />
    <link rel="shortcut icon" href="%BASE_URL%favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Critical Asset Preloading for Instant Visual Load -->
    <link rel="preload" as="image" href="%BASE_URL%images/bb.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="%BASE_URL%logo.png" type="image/png" fetchpriority="high" />
    <link rel="prefetch" as="image" href="%BASE_URL%images/city-to-city.webp" type="image/webp" />
    <link rel="prefetch" as="image" href="%BASE_URL%images/bc.webp" type="image/webp" />
    <link rel="prefetch" as="image" href="%BASE_URL%images/courier-delivery.webp" type="image/webp" />
    <link rel="prefetch" as="image" href="%BASE_URL%images/truck-clearing.webp" type="image/webp" />
    
    <!-- Primary Meta Tags -->
    <title>XLDriv — Move On Your Terms | Nigeria's Modern Mobility Platform</title>
    <meta name="title" content="XLDriv — Move On Your Terms | Nigeria's Modern Mobility Platform" />
    <meta name="description" content="Set your fare and negotiate directly with drivers. Everyday city rides, intercity trips, ride-sharing, courier delivery, and freight trucking across Nigeria." />
    <meta name="keywords" content="XLDriv, ride-hailing Nigeria, Lagos taxi, set your fare, negotiate ride, intercity trips, courier service Lagos, zero commission driver app, ₦2450 subscription" />
    <meta name="theme-color" content="#F7B401" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://xldriv.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://xldriv.com/" />
    <meta property="og:title" content="XLDriv — Move On Your Terms" />
    <meta property="og:description" content="Set your fare, negotiate with drivers, and travel freely across Nigeria. 0% commission for drivers with our flat daily subscription." />
    <meta property="og:image" content="https://xldriv.com/logo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://xldriv.com/" />
    <meta property="twitter:title" content="XLDriv — Move On Your Terms" />
    <meta property="twitter:description" content="Book a ride, set your fare, and connect with drivers who get you moving." />
    <meta property="twitter:image" content="https://xldriv.com/logo.png" />

    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Single Page Apps for GitHub Pages: restores deep-link route before router loads -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body class="bg-white text-dark-900 font-sans antialiased selection:bg-brand-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
